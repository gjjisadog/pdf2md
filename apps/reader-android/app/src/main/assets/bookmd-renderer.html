<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BookMD Reader</title>
    <style>
      body {
        margin: 0;
        background: #fbfaf7;
        color: #24211c;
        font-family: serif;
      }
      .bookmd-content {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 22px 20px 40px;
        font-size: var(--bookmd-font-size, 18px);
        line-height: var(--bookmd-line-height, 1.75);
      }
      .bookmd-figure,
      .bookmd-formula,
      .bookmd-table {
        margin: 1.25rem 0;
        padding: 0.75rem 0;
        border-block: 1px solid #d8d1c3;
      }
      .bookmd-figure img,
      .bookmd-formula img,
      .bookmd-table img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
      }
      .bookmd-bilingual {
        display: grid;
        gap: 0.45rem;
        margin: 1rem 0;
        padding-inline-start: 0.85rem;
        border-inline-start: 3px solid #1f6f78;
      }
      .bookmd-bilingual-source,
      .bookmd-caption {
        color: #6f6a60;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <main id="bookmd-content" class="bookmd-content"></main>
    <script>
      (function () {
        function loadChapter(payload) {
          const root = document.getElementById("bookmd-content");
          root.innerHTML = payload.html || renderMarkdown(payload.markdown || "");
          bindBlockEvents(root);
        }

        function renderMarkdown(markdown) {
          const lines = markdown.split(/\r?\n/);
          const html = [];
          let trace = "";
          for (let index = 0; index < lines.length; index += 1) {
            const line = lines[index];
            const traceMatch = line.match(/^<!-- block_id: ([^;]+); page: ([^;]+); bbox: (.+) -->$/);
            if (traceMatch) {
              trace = traceMatch[1];
              continue;
            }
            if (line.startsWith(":::figure") || line.startsWith(":::formula") || line.startsWith(":::table")) {
              const kind = line.slice(3).split(/\s+/)[0];
              const src = readAttribute(line, "src");
              const captionLines = [];
              while (index + 1 < lines.length && lines[index + 1] !== ":::") {
                index += 1;
                captionLines.push(lines[index]);
              }
              index += 1;
              html.push(`<figure class="bookmd-block bookmd-${kind}" data-block-id="${escapeHtml(trace)}"><img src="${escapeHtml(src)}"><figcaption class="bookmd-caption">${escapeHtml(captionLines.join("\n"))}</figcaption></figure>`);
              trace = "";
              continue;
            }
            if (!line.trim()) continue;
            const heading = line.match(/^(#{1,6})\s+(.+)$/);
            if (heading) {
              html.push(`<h${heading[1].length} data-block-id="${escapeHtml(trace)}">${escapeHtml(heading[2])}</h${heading[1].length}>`);
            } else {
              html.push(`<p data-block-id="${escapeHtml(trace)}">${escapeHtml(line)}</p>`);
            }
            trace = "";
          }
          return html.join("\n");
        }

        function bindBlockEvents(root) {
          root.querySelectorAll("[data-block-id]").forEach((node) => {
            node.addEventListener("click", () => {
              if (window.AndroidBookMD) window.AndroidBookMD.onBlockSelected(node.dataset.blockId);
            });
          });
        }

        function jumpToBlock(blockId) {
          const node = document.querySelector(`[data-block-id="${blockId}"]`);
          if (!node) return false;
          node.scrollIntoView({ block: "center", behavior: "smooth" });
          return true;
        }

        function searchInChapter(query) {
          clearSearchHighlights();
          if (!query) return [];
          const results = [];
          document.querySelectorAll("[data-block-id]").forEach((node) => {
            const text = node.textContent || "";
            if (!text.toLowerCase().includes(query.toLowerCase())) return;
            results.push({ block_id: node.dataset.blockId || "", text: text });
            node.innerHTML = escapeHtml(text).replace(
              new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"),
              (match) => `<mark class="bookmd-search-hit">${match}</mark>`
            );
          });
          return results;
        }

        function clearSearchHighlights() {
          document.querySelectorAll(".bookmd-search-hit").forEach((node) => {
            const parent = node.parentElement;
            if (parent) parent.textContent = parent.textContent || "";
          });
        }

        function readAttribute(text, name) {
          const match = text.match(new RegExp(`${name}="([^"]*)"`));
          return match ? match[1] : "";
        }

        function escapeHtml(text) {
          return String(text)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
        }

        window.BookMDReader = { loadChapter, renderMarkdown, jumpToBlock, searchInChapter, clearSearchHighlights };
      })();
    </script>
  </body>
</html>
